# The pinned replay corpus. Each [[episode]] names <id>.json.gz and
# <id>.decisions.json in this directory, and
# every_corpus_entry_replays_to_its_pinned_decisions checks each one.
#
#   kind = "synthetic"  built by a scenario in src/diagnose/fixture.rs;
#                       `netwatch diagnose corpus` rebuilds its frames
#   kind = "lab"        recorded by tests/diagnose/health_lab.py; its frames
#                       are kept and only its decisions are re-derived
#
# Regenerate after an intended change in what the engine concludes:
#   cargo run -- diagnose corpus [--only ID]

[[episode]]
id = "fixture-scenario"
kind = "synthetic"
rules = ["path.changed", "dns.slow_resolver", "tcp.bufferbloat_remote"]
note = "The demo incident: a reroute adding 40 ms, a resolver at 33x its baseline and a bufferbloated LAN socket. Nothing closes."

[[episode]]
id = "retrans-socket-closes"
kind = "synthetic"
rules = ["tcp.retrans_burst"]
note = "An scp upload retransmits 18 segments a minute at 38 ms from 120 s and ends at 300 s. A healthy browser socket stays listed, so the issue expires a minute after the upload's socket closes."

[[episode]]
id = "bufferbloat-remote-socket-closes"
kind = "synthetic"
rules = ["tcp.bufferbloat_remote"]
note = "The demo's LAN socket goes from 1.1 ms to 184 ms at 120 s and closes at 300 s beside a healthy browser socket. It expires a minute after the close."

[[episode]]
id = "zero-window-socket-closes"
kind = "synthetic"
rules = ["tcp.zero_window"]
note = "An rsync to a NAS sees a zero window from 120 s and gives up at 300 s. It was the host's only socket, so the sampler then lists none (no subjects), and the observation expires a minute later."

[[episode]]
id = "path-rtt-spike"
kind = "synthetic"
rules = ["path.rtt_spike"]
note = "Traces to 1.1.1.1 every 30 s against the internet baseline (12 ms, σ 1.8): 13.4 ms, then 80 ms from 120 s, 16.5 ms (2.5σ, between the close and open lines) from 300 s, and 13.4 ms from 420 s. Opens on the third slow trace and closes after 120 s under the 2σ line."
